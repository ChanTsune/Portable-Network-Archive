[workspace]
members = ["cargo:cli"]

# Config for 'dist'
[dist]
# Skip checking whether the specified configuration files are up to date
allow-dirty = ["ci"]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "aarch64-pc-windows-msvc",
    "riscv64gc-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    # "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
# Which actions to run on pull requests
pr-run-mode = "upload"
# Whether to consider the binaries in a package for distribution (defaults true)
dist = true
# Where to host releases
hosting = "github"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
# Disabled: axoupdater does not provide a RISC-V prebuilt binary
install-updater = false
# Enable GitHub Artifact Attestations (Sigstore/SLSA provenance)
github-attestations = true
# Build only the required packages, and individually
precise-builds = true
# Features to pass to cargo build
features = ["acl", "memmap"]

[dist.github-custom-runners]
riscv64gc-unknown-linux-gnu = "ubuntu-24.04-riscv"
aarch64-pc-windows-msvc = "windows-11-arm"

[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9"
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333"
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6"
"swatinem/rust-cache" = "d1527c8f67ef9af357290475d4af4b0fab8f12e0"

[dist.dependencies.apt]
libacl1-dev = { stage = ["build", "run"], targets = ["aarch64-unknown-linux-gnu", "riscv64gc-unknown-linux-gnu", "x86_64-unknown-linux-gnu"] }
