name: OpenCode issue implementation
run-name: "OpenCode issue #${{ inputs.issue_number }}"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Removal management issue number"
        required: true
        type: string

permissions: {}

jobs:
  implement:
    name: Implement issue
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: opencode-${{ inputs.issue_number }}
      cancel-in-progress: false
    permissions:
      id-token: write # OIDC token for the OpenCode GitHub App
      contents: write # publish implementation branches
      pull-requests: write # publish implementation PRs
      issues: write # read requirements and comment on issues
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare issue prompt
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: python3 .agents/skills/deprecation-requests/scripts/deprecation_requests.py --prompt "$ISSUE_NUMBER"

      - name: Select model
        id: select
        uses: $/.github/actions/select-opencode-model
        with:
          api-key: ${{ secrets.OPENCODE_API_KEY }}

      - name: Implement issue with OpenCode
        uses: anomalyco/opencode/github@a3b97d9090ccf4aa9ac32268486283e3131e36b4 # github-v1.2.25
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ steps.select.outputs.model }}
          prompt: ${{ steps.issue.outputs.prompt }}
