name: test
permissions:
  contents: read # checkout
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/**"
      - "pna/**"
      - "cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "resources/test/**"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - ".github/actions/**"
      - ".github/workflows/test.yml"
  push:
    paths:
      - "lib/**"
      - "pna/**"
      - "cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "resources/test/**"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - ".github/actions/**"
      - ".github/workflows/test.yml"
jobs:
  tier1:
    name: Tier 1
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-22.04-arm # TODO: use ubuntu-24.04-arm if https://github.com/rust-lang/rust/issues/135867 resolved
          - windows-latest
          - windows-11-arm
          - macos-latest
#          - freebsd-latest # self-hosted
        rust:
          - stable
          - beta
          - nightly
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    steps:
      - name: git autocrlf false
        if: startsWith(matrix.os, 'windows')
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: install dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt update
          sudo apt install -y libacl1-dev
      - name: Install Rustup
        if: ${{ matrix.os == 'windows-11-arm' }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile "$env:TEMP\rustup-init.exe"
           & "$env:TEMP\rustup-init.exe" --default-toolchain none --profile=minimal -y
          "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding ascii $env:GITHUB_PATH
          "CARGO_HOME=$env:USERPROFILE\.cargo" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: install_rust
        uses: $/.github/actions/setup-rust
        with:
          channel: ${{ matrix.rust }}
      - name: Install cargo-hack from crates.io
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-hack
          cache-key: ${{ matrix.os }}
      - name: Restore rust build cache
        id: restore-rust-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/*
            !target/tmp
          key: "${{ matrix.os }}-${{ steps.install_rust.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}"
          restore-keys: "${{ matrix.os }}-${{ steps.install_rust.outputs.version }}"
      - name: run test
        run: |
          cargo hack test --locked --release --feature-powerset --exclude-features wasm --exclude portable-network-archive-fuzz --exclude xtask -- --test-threads=1
        env:
          RUST_BACKTRACE: 1
          PNA_TEST_REQUIRE: ${{ startsWith(matrix.os, 'windows') && 'birthtime,mtime_nanos' || 'birthtime,mtime_nanos,xattr,nodump,chmod,setuid,unprivileged' }}
      - name: Save rust build cache
        if: github.ref_name == github.event.repository.default_branch && matrix.rust == 'stable' && steps.restore-rust-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/*
            !target/tmp
          key: "${{ steps.restore-rust-build-cache.outputs.cache-primary-key }}"

  tier3_cross:
    name: Tier 3 Cross-compile
    strategy:
      fail-fast: false
      matrix:
        include:
          # no versioned tag is published upstream; pinned to the current `latest` digest
          - container: redoxos/redoxer:latest@sha256:8b1abee9dfa4162a798e8519d1275f39a8ddbfbc7ec0ba4707ea6c07a0416aef
            target: x86_64-unknown-redox
    runs-on: ubuntu-latest
    timeout-minutes: 150
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: run test
        if: startsWith(matrix.target, 'x86_64-unknown-redox')
        run: |
          # use the bundled toolchain: its std/relibc match the pinned image's
          # kernel, while rustup's nightly std is ahead of it and crashes the
          # binaries it builds with
          # "Using old SYS_OPENAT_INTO ... update relibc/base and rebuild"
          export PATH="/root/.redoxer/$TARGET/toolchain/bin:$PATH"
          export RUSTUP_TOOLCHAIN="/root/.redoxer/$TARGET/toolchain"
          # map the workspace to the same absolute path inside the VM so Cargo's
          # compile-time CARGO_* paths resolve; the small /root mapping avoids
          # redoxer's automatic test-binary copy (the trailing "/" is required)
          export CARGO_TARGET_X86_64_UNKNOWN_REDOX_RUNNER="redoxer exec --folder $PWD/:$PWD/ --folder $PWD/resources/test/:/root"
          # Redox does not enforce NAME_MAX or support filetime; the host jobs
          # already check these tests.
          cargo test -p libpna -p pna -p portable-network-archive --lib --locked --target "$TARGET" -- --test-threads=1 --skip command::core::staged_archive::tests::new_fails_when_the_mode_of_the_output_cannot_be_read --skip command::update::tests::is_newer_than_archive_

          # Run the CLI integration suite one module at a time so a slow or
          # hanging module cannot stall unrelated modules. Host-only xattr
          # coverage, the very large combination matrix, the filetime-only
          # keep_all test, and the bsdtar compatibility module stay on host
          # jobs because they depend on host filesystem semantics.
          set -- \
            --skip append::atime:: \
            --skip append::ctime:: \
            --skip append::mtime:: \
            --skip append::option_newer_mtime:: \
            --skip append::option_newer_mtime_than:: \
            --skip append::option_older_mtime:: \
            --skip append::option_older_mtime_than:: \
            --skip create::atime:: \
            --skip create::ctime:: \
            --skip create::mtime:: \
            --skip create::option_newer_mtime:: \
            --skip create::option_newer_mtime_than:: \
            --skip create::option_older_mtime:: \
            --skip create::option_older_mtime_than:: \
            --skip create::symlink_metadata::roundtrip_symlink_metadata_preserved \
            --skip diff::metadata:: \
            --skip diff::option_compare:: \
            --skip diff::option_format::diff_with_format_jsonl_and_metadata_differences \
            --skip extract::option_keep_newer_files:: \
            --skip extract::option_keep_permission::extract_encrypted_gcm_without_keep_permission_drops_setuid \
            --skip extract::option_keep_timestamp:: \
            --skip extract::option_mtime:: \
            --skip extract::symlink_metadata:: \
            --skip list::option_format_jsonl::list_format_jsonl_with_xattr \
            --skip update::duplicate_targets:: \
            --skip update::encryption:: \
            --skip update::mtime_stored_precision:: \
            --skip update::multipart:: \
            --skip update::no_timestamp_archive:: \
            --skip update::option_atime:: \
            --skip update::option_ctime:: \
            --skip update::option_exclude:: \
            --skip update::option_include:: \
            --skip update::option_keep_solid:: \
            --skip update::option_mtime:: \
            --skip update::option_newer_mtime:: \
            --skip update::option_newer_mtime_than:: \
            --skip update::option_older_mtime:: \
            --skip update::option_older_mtime_than:: \
            --skip update::option_output:: \
            --skip update::option_sync::update_with_sync \
            --skip update::option_unsolid:: \
            --skip update::path_transform::
          set +e
          failed=0
          for module in acl append bugreport chmod chown chunk complete concat create delete diff encrypt extract flag_pairs hardlink keep_acl list migrate multipart nodump restore_acl restore_acl_0_19_1 solid_mode sort split strip update verify utils; do
            printf '===== cli tests: %s =====\n' "$module"
            timeout -s TERM -k 30s 20m cargo test -p portable-network-archive --test cli --locked --target "$TARGET" -- --test-threads=1 "$module::" "$@"
            status=$?
            printf '===== cli tests: %s status=%s =====\n' "$module" "$status"
            retry=0
            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              retry=1
            fi
            # The first CLI test binary invocation can report a runner
            # failure even when the tests passed; retry acl once.
            if [ "$module" = acl ] && [ "$status" -ne 0 ]; then
              retry=1
            fi
            if [ "$retry" -eq 1 ]; then
              pkill -9 -f 'redoxer exec' || true
              printf '===== cli tests: %s retry =====\n' "$module"
              timeout -s TERM -k 30s 20m cargo test -p portable-network-archive --test cli --locked --target "$TARGET" -- --test-threads=1 "$module::" "$@"
              status=$?
              printf '===== cli tests: %s retry status=%s =====\n' "$module" "$status"
            fi
            if [ "$status" -ne 0 ]; then
              failed=1
            fi
          done
          printf '===== cli tests: clap_configuration_remains_valid =====\n'
          timeout -s TERM -k 30s 20m cargo test -p portable-network-archive --test cli --locked --target "$TARGET" -- --test-threads=1 clap_configuration_remains_valid
          status=$?
          printf '===== cli tests: clap_configuration_remains_valid status=%s =====\n' "$status"
          if [ "$status" -ne 0 ]; then
            failed=1
            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              pkill -9 -f 'redoxer exec' || true
            fi
          fi
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          cargo build -p portable-network-archive --locked --target "$TARGET"
          cp target/"$TARGET"/debug/pna pna-bin
          cargo clean
          redoxer exec --folder . -- /root/pna-bin --version
        env:
          TARGET: ${{ matrix.target }}
          RUST_BACKTRACE: 1
          # redoxer defaults to -smp 4; the multi-core kernel intermittently
          # crashes libtest's pthread_join, so use one CPU like upstream Redox CI
          REDOXER_QEMU_ARGS: "-smp 1"
          AR_x86_64_unknown_redox: "x86_64-unknown-redox-ar"
          CC_x86_64_unknown_redox: "x86_64-unknown-redox-gcc"
          CARGO_TARGET_X86_64_UNKNOWN_REDOX_LINKER: "x86_64-unknown-redox-gcc"

  tier3:
    name: Tier 3
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        rust:
          - stable
        target:
          - x86_64-pc-solaris
          - x86_64-unknown-fuchsia
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: install_rust
        uses: $/.github/actions/setup-rust
        with:
          channel: ${{ matrix.rust }}
          target: ${{ matrix.target }}
      - name: run test
        run: |
          cargo check --locked --target "$TARGET" --workspace --exclude portable-network-archive-fuzz --exclude xtask
        env:
          TARGET: ${{ matrix.target }}
          RUST_BACKTRACE: 1

  msrv:
    name: MSRV
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        crate:
          - libpna
          - pna
          - portable-network-archive
        include:
          - crate: libpna
            rust: '1.88'
          - crate: pna
            rust: '1.88'
          - crate: portable-network-archive
            rust: '1.88'
    runs-on: ${{ matrix.os }}
    steps:
      - name: git autocrlf false
        if: startsWith(matrix.os, 'windows')
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: install dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt update
          sudo apt install -y libacl1-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: install_rust
        uses: $/.github/actions/setup-rust
        with:
          channel: ${{ matrix.rust }}
      - name: Install cargo-hack from crates.io
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-hack
          cache-key: ${{ matrix.os }}
      - name: Restore rust build cache
        id: restore-rust-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/*
            !target/tmp
          key: "${{ matrix.os }}-${{ steps.install_rust.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}"
          restore-keys: "${{ matrix.os }}-${{ steps.install_rust.outputs.version }}"
      - name: run test
        run: |
          cargo hack test --locked --release --feature-powerset --exclude-features wasm -p "$CRATE" -- --test-threads=1
        env:
          CRATE: ${{ matrix.crate }}
          RUST_BACKTRACE: 1
          PNA_TEST_REQUIRE: birthtime,mtime_nanos,xattr,nodump,chmod,setuid,unprivileged
      - name: Save rust build cache
        if: github.ref_name == github.event.repository.default_branch && steps.restore-rust-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/*
            !target/tmp
          key: "${{ steps.restore-rust-build-cache.outputs.cache-primary-key }}"
