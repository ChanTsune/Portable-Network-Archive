  OmniOS-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: Test on OmniOS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test in OmniOS
        id: test
        uses: vmactions/omnios-vm@317e4f8069dad8a65e1520808f1a68ef3fd20565 # v1.3.6
        with:
          envs: "RUST_BACKTRACE PNA_TEST_REQUIRE"
          copyback: false
          disable-cache: true
          usesh: true
          prepare: |
            pkg install curl pkg:/developer/gcc13 cmake
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          run: |
            set -e
            . "$HOME/.cargo/env"
            export LC_ALL=C LANG=C
            uname -a
            chown -R $(whoami):$(id -gn) ./
            chmod -R a+rw ./
            cargo install -f cargo-hack --locked
            cargo hack test --locked --release --each-feature --exclude-features wasm,zlib-ng -p libpna -p pna -p portable-network-archive
