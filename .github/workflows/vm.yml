name: VM Tests
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "lib/**"
      - "pna/**"
      - "cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "resources/test/**"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/vm.yml"
  pull_request:
    branches: ["*"]
    paths:
      - "lib/**"
      - "pna/**"
      - "cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "resources/test/**"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/vm.yml"

permissions:
  contents: read # checkout

env:
  RUST_BACKTRACE: 1
  # These VMs run the suite as root, so a skip for want of privilege is a defect.
  PNA_TEST_REQUIRE: root

jobs:
  solaris-test:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    name: Test on Solaris
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test in Solaris
        id: test
        uses: vmactions/solaris-vm@96d8d976f9e67d82ec6c7e8ce9c1060731f9e21c # v1.3.9
        with:
          envs: "RUST_BACKTRACE PNA_TEST_REQUIRE"
          copyback: false
          disable-cache: true
          usesh: true
          prepare: |
            pkg install bash libtool gnu-m4 tree wget gcc autoconf //solaris/text/gawk pkg://solaris/text/gnu-diffutils pkg://solaris/text/gnu-grep pkg://solaris/text/gnu-sed cmake
            source <(curl -s https://raw.githubusercontent.com/psumbera/solaris-rust/refs/heads/main/sh.rust-web-install)
            # mv /root/.rust_solaris/rustc-*/ /root/.rust_solaris/rustc/
          run: |
            set -e
            export LC_ALL=C LANG=C
            # export PATH=/root/.rust_solaris/rustc/bin:$PATH
            uname -a
            chown -R $(whoami):$(id -gn) ./
            chmod -R a+rw ./
            cargo install -f cargo-hack@0.6.33 --locked
            cargo hack test --locked --release --each-feature --exclude-features wasm -p libpna -p pna -p portable-network-archive

  NetBSD-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: Test on NetBSD
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test in NetBSD
        id: test
        uses: vmactions/NetBSD-vm@6334c835de4c04a59fe59f0f8f071e02a2f0bab3 # v1.4.7
        with:
          envs: "RUST_BACKTRACE PNA_TEST_REQUIRE"
          copyback: false
          disable-cache: true
          usesh: true
          prepare: |
            /usr/sbin/pkg_add -v curl cmake
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          run: |
            set -e
            . "$HOME/.cargo/env"
            export LC_ALL=C LANG=C
            uname -a
            export PATH=$PATH:/usr/sbin
            chown -R $(whoami):$(id -gn) ./
            chmod -R a+rw ./
            cargo install -f cargo-hack --locked
            cargo hack test --locked --release --each-feature --exclude-features wasm -p libpna -p pna -p portable-network-archive

  FreeBSD-test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    name: Test on FreeBSD
    env:
      # This job exists to exercise POSIX.1e ACLs and extended attributes on
      # the UFS image mounted below, so a skip for want of xattr means that
      # mount stopped delivering them.
      PNA_TEST_REQUIRE: root,xattr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test in FreeBSD
        id: test
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          envs: "RUST_BACKTRACE PNA_TEST_REQUIRE"
          copyback: false
          disable-cache: true
          usesh: true
          prepare: |
            # vmactions/freebsd-vm 15.0 images enable FreeBSD-ports repos.
            # Keep package resolution on the base FreeBSD repo; otherwise
            # pkg can mix pkg-devel from ports with pkg from FreeBSD and fail.
            mkdir -p /usr/local/etc/pkg/repos
            cat > /usr/local/etc/pkg/repos/FreeBSD.conf <<'EOF'
            FreeBSD: {
              url: "pkg+https://pkg.FreeBSD.org/${ABI}/quarterly",
              mirror_type: "srv",
              signature_type: "none",
              enabled: yes
            }
            EOF
            cat > /usr/local/etc/pkg/repos/FreeBSD-ports.conf <<'EOF'
            FreeBSD-ports: {
              enabled: no
            }
            EOF
            cat > /usr/local/etc/pkg/repos/FreeBSD-ports-kmods.conf <<'EOF'
            FreeBSD-ports-kmods: {
              enabled: no
            }
            EOF
            pkg install -y curl cmake
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          run: |
            set -e
            . "$HOME/.cargo/env"
            export LC_ALL=C LANG=C
            uname -a
            # vmactions/freebsd-vm root is ZFS+nfsv4acls; POSIX.1e ACL tests
            # need a UFS+acls filesystem. Create a vnode-backed UFS image and
            # point CARGO_TARGET_DIR there so integration test cwd
            # (CARGO_TARGET_TMPDIR = $CARGO_TARGET_DIR/tmp) lives on UFS.
            truncate -s 4g /tmp/ufs.img
            mdconfig -a -t vnode -f /tmp/ufs.img -u 9
            newfs /dev/md9
            mkdir -p /mnt/ufs
            mount -o acls /dev/md9 /mnt/ufs
            export CARGO_TARGET_DIR=/mnt/ufs/target
            mkdir -p "$CARGO_TARGET_DIR"
            chown -R $(whoami):$(id -gn) ./
            chmod -R a+rw ./
            cargo install -f cargo-hack --locked
            cargo hack test --locked --release --each-feature --exclude-features wasm -p libpna -p pna -p portable-network-archive

  OpenBSD-test:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    name: Test on OpenBSD
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test in OpenBSD
        id: test
        uses: vmactions/OpenBSD-vm@86cdc08415d9d0865267e686561e276c52d62530 # v1.4.7
        with:
          envs: "RUST_BACKTRACE PNA_TEST_REQUIRE"
          copyback: false
          disable-cache: true
          usesh: true
          prepare: |
            /usr/sbin/pkg_add -I -v gmake gettext-tools gtar libtool m4 cmake
            /usr/sbin/pkg_add -I -v rust
          run: |
            set -e
            export LC_ALL=C LANG=C
            uname -a
            chown -R $(whoami):$(id -gn) ./
            chmod -R a+rw ./
            cargo install -f cargo-hack --locked
            ulimit -n 2048
            cargo hack test --locked --release --each-feature --exclude-features wasm -p libpna -p pna -p portable-network-archive

