name: Redox CI stability investigation

on:
  workflow_dispatch:
  push:
    branches:
      - investigate/redox-cli-stability

permissions:
  contents: read

jobs:
  redox-diagnostics:
    name: Redox CLI failure isolation
    runs-on: ubuntu-latest
    timeout-minutes: 32
    container: redoxos/redoxer:latest@sha256:8b1abee9dfa4162a798e8519d1275f39a8ddbfbc7ec0ba4707ea6c07a0416aef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use bundled Redoxer assets
        run: ln -s /root/.redoxer "$HOME/.redoxer"
      - name: Record execution environment
        run: |
          set -eu
          printf '=== host and runner ===\n'
          uname -a
          id
          printf 'HOME=%s TARGET=%s\n' "$HOME" "$TARGET"
          ls -ld "$HOME/.redoxer" /root/.redoxer/"$TARGET" /root/.redoxer/"$TARGET"/toolchain
          printf '=== tools ===\n'
          command -v redoxer
          command -v qemu-system-x86_64
          qemu-system-x86_64 --version | head -n 1
          /root/.redoxer/"$TARGET"/toolchain/bin/rustc --version
          /root/.redoxer/"$TARGET"/toolchain/bin/cargo --version
          printf '=== virtualization access ===\n'
          ls -l /dev/kvm /dev/fuse || true
          printf '=== capacity ===\n'
          df -h . /tmp
          free -h || true
          printf '=== Redoxer settings ===\n'
          printf 'REDOXER_QEMU_ARGS=%s\n' "$REDOXER_QEMU_ARGS"
        env:
          TARGET: x86_64-unknown-redox
          REDOXER_QEMU_ARGS: "-smp 1"
      - name: Compare minimal and workspace-loaded Redox boots
        timeout-minutes: 28
        env:
          TARGET: x86_64-unknown-redox
          RUST_BACKTRACE: "1"
          REDOXER_QEMU_ARGS: "-smp 1"
          AR_x86_64_unknown_redox: x86_64-unknown-redox-ar
          CC_x86_64_unknown_redox: x86_64-unknown-redox-gcc
          CARGO_TARGET_X86_64_UNKNOWN_REDOX_LINKER: x86_64-unknown-redox-gcc
        run: |
          set -eu
          export PATH="/root/.redoxer/$TARGET/toolchain/bin:$PATH"
          export RUSTUP_TOOLCHAIN="/root/.redoxer/$TARGET/toolchain"
          export CARGO_TARGET_X86_64_UNKNOWN_REDOX_RUNNER="redoxer exec --folder $PWD/:$PWD/ --folder $PWD/resources/test/:/root"
          cargo test -p portable-network-archive --test cli --no-run --locked --target "$TARGET"

          printf 'PNA_DIAG ENV runner=%s qemu_args=%s\n' "$CARGO_TARGET_X86_64_UNKNOWN_REDOX_RUNNER" "$REDOXER_QEMU_ARGS"
          minimal_failures=0
          loaded_failures=0
          for i in 1 2 3 4 5; do
            printf 'PNA_DIAG BEGIN minimal_%s at=%s\n' "$i" "$(date -u +%FT%TZ)"
            set +e
            timeout -s TERM -k 15s 90s redoxer exec -- /usr/bin/ion -c 'echo REDOX_MINIMAL_OK'
            minimal_status=$?
            set -e
            printf 'PNA_DIAG END minimal_%s status=%s at=%s\n' "$i" "$minimal_status" "$(date -u +%FT%TZ)"
            if [ "$minimal_status" -ne 0 ]; then minimal_failures=$((minimal_failures + 1)); fi

            printf 'PNA_DIAG BEGIN workspace_%s at=%s\n' "$i" "$(date -u +%FT%TZ)"
            set +e
            timeout -s TERM -k 15s 90s cargo test -p portable-network-archive --test cli --locked --target "$TARGET" -- --test-threads=1 __pna_redox_nonexistent_boot_probe__ --exact
            workspace_status=$?
            set -e
            printf 'PNA_DIAG END workspace_%s status=%s at=%s\n' "$i" "$workspace_status" "$(date -u +%FT%TZ)"
            if [ "$workspace_status" -ne 0 ]; then loaded_failures=$((loaded_failures + 1)); fi

            printf 'PNA_DIAG RESIDUAL iteration=%s\n' "$i"
            ps -eo pid,ppid,stat,etime,comm | grep -E '[q]emu-system|[r]edoxer' || true
            df -h /tmp | tail -n 1
          done

          printf 'PNA_DIAG SUMMARY minimal_failures=%s workspace_failures=%s attempts_each=5\n' "$minimal_failures" "$loaded_failures"
          # A failure is experimental evidence, not a reason to skip later attempts.
          exit 0
