name: Redox CI stability investigation

on:
  workflow_dispatch:
  push:
    branches:
      - investigate/redox-cli-stability

permissions:
  contents: read

jobs:
  redox-diagnostics:
    name: Redox CLI failure isolation
    runs-on: ubuntu-latest
    timeout-minutes: 48
    container: redoxos/redoxer:latest@sha256:8b1abee9dfa4162a798e8519d1275f39a8ddbfbc7ec0ba4707ea6c07a0416aef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use bundled Redoxer assets
        run: ln -s /root/.redoxer "$HOME/.redoxer"
      - name: Record execution environment
        run: |
          set -eu
          printf '=== host and runner ===\n'
          uname -a
          id
          printf 'HOME=%s TARGET=%s\n' "$HOME" "$TARGET"
          ls -ld "$HOME/.redoxer" /root/.redoxer/"$TARGET" /root/.redoxer/"$TARGET"/toolchain
          printf '=== tools ===\n'
          command -v redoxer
          command -v qemu-system-x86_64
          qemu-system-x86_64 --version | head -n 1
          /root/.redoxer/"$TARGET"/toolchain/bin/rustc --version
          /root/.redoxer/"$TARGET"/toolchain/bin/cargo --version
          printf '=== virtualization access ===\n'
          ls -l /dev/kvm /dev/fuse || true
          printf '=== capacity ===\n'
          df -h . /tmp
          free -h || true
          printf '=== Redoxer settings ===\n'
          printf 'REDOXER_QEMU_ARGS=%s\n' "$REDOXER_QEMU_ARGS"
        env:
          TARGET: x86_64-unknown-redox
          REDOXER_QEMU_ARGS: "-smp 1"
      - name: Compare real CLI tests across QEMU CPU models
        timeout-minutes: 45
        env:
          TARGET: x86_64-unknown-redox
          RUST_BACKTRACE: "1"
          REDOXER_QEMU_ARGS: "-smp 1"
          AR_x86_64_unknown_redox: x86_64-unknown-redox-ar
          CC_x86_64_unknown_redox: x86_64-unknown-redox-gcc
          CARGO_TARGET_X86_64_UNKNOWN_REDOX_LINKER: x86_64-unknown-redox-gcc
        run: |
          set -eu
          export PATH="/root/.redoxer/$TARGET/toolchain/bin:$PATH"
          export RUSTUP_TOOLCHAIN="/root/.redoxer/$TARGET/toolchain"
          export CARGO_TARGET_X86_64_UNKNOWN_REDOX_RUNNER="redoxer exec --folder $PWD/:$PWD/ --folder $PWD/resources/test/:/root"

          printf 'PNA_DIAG EXPERIMENT real_cli=chmod,delete repetitions_each=3 cpu=max,qemu64\n'
          cargo test -p portable-network-archive --test cli --locked --no-run --target "$TARGET"

          max_ok=0
          max_fail=0
          qemu64_ok=0
          qemu64_fail=0
          pair_index=0
          for module in chmod delete; do
            for repetition in 1 2 3; do
              pair_index=$((pair_index + 1))
              # Balance the ordering between CPU models across the six pairs.
              if [ $((pair_index % 2)) -eq 1 ]; then
                order="max qemu64"
              else
                order="qemu64 max"
              fi
              for cpu in $order; do
                case "$cpu" in
                  max) export REDOXER_QEMU_ARGS="-smp 1" ;;
                  qemu64) export REDOXER_QEMU_ARGS="-smp 1 -cpu qemu64" ;;
                esac
                printf 'PNA_DIAG BEGIN module=%s repetition=%s cpu=%s at=%s\n' "$module" "$repetition" "$cpu" "$(date -u +%FT%TZ)"
                set +e
                timeout -s TERM -k 15s 3m cargo test -p portable-network-archive --test cli --locked --target "$TARGET" -- --test-threads=1 "$module::"
                status=$?
                set -e
                printf 'PNA_DIAG END module=%s repetition=%s cpu=%s status=%s at=%s\n' "$module" "$repetition" "$cpu" "$status" "$(date -u +%FT%TZ)"
                if [ "$cpu" = max ]; then
                  if [ "$status" -eq 0 ]; then max_ok=$((max_ok + 1)); else max_fail=$((max_fail + 1)); fi
                else
                  if [ "$status" -eq 0 ]; then qemu64_ok=$((qemu64_ok + 1)); else qemu64_fail=$((qemu64_fail + 1)); fi
                fi
                if [ "$status" -ne 0 ]; then
                  printf 'PNA_DIAG FAILURE module=%s cpu=%s status=%s\n' "$module" "$cpu" "$status"
                  ps -eo pid,ppid,stat,etime,comm | grep -E '[q]emu-system|[r]edoxer' || true
                  df -h /tmp | tail -n 1
                fi
              done
            done
          done
          printf 'PNA_DIAG SUMMARY max_ok=%s max_fail=%s qemu64_ok=%s qemu64_fail=%s attempts_each=6\n' "$max_ok" "$max_fail" "$qemu64_ok" "$qemu64_fail"
          # Record evidence of flaky boots without failing before later probes.
          exit 0
