name: actions-lint
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/actionlint.yaml"
      - ".github/zizmor.yml"
  push:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/actionlint.yaml"
      - ".github/zizmor.yml"
  schedule:
    - cron: '15 13 * * 0'
jobs:
  actionlint:
    name: Run actionlint
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read # checkout
      checks: write # reviewdog annotations
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: reviewdog/action-actionlint/dockerless@13465d022aa41c282f730be17574b5ce692d0186 # v1.78.1
        with:
          fail_level: error
          filter_mode: nofilter
          reporter: github-check
  zizmor:
    name: Run zizmor
    # Scans all workflows including auto-generated release.yml;
    # suppress false positives via zizmor.yml config if needed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # checkout
      security-events: write # SARIF upload
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          persona: pedantic
