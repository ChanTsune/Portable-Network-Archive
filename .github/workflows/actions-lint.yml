name: actions-lint
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/actionlint.yaml"
      - ".github/zizmor.yml"
  push:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/actionlint.yaml"
      - ".github/zizmor.yml"
  schedule:
    - cron: '15 13 * * 0'
jobs:
  actionlint:
    name: Run actionlint
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read # checkout
      checks: write # reviewdog annotations
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: reviewdog/action-actionlint/dockerless@b76d06f8570118465db3190c9a08f1b29d341aa1 # v1.80.3
        with:
          fail_level: error
          filter_mode: nofilter
          reporter: github-check
  zizmor:
    name: Run zizmor
    # Scans all workflows including auto-generated release.yml;
    # suppress false positives via zizmor.yml config if needed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # checkout
      security-events: write # SARIF upload
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          persona: pedantic
